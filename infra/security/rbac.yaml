apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: clinical-ai
automountServiceAccountToken: false   # backend doesn't call the k8s API
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: clinical-ai
rules: []   # intentionally empty -- least privilege; add explicit rules only
            # when a concrete in-cluster API need arises
