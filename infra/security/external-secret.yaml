# Replaces backend-secret.example.yaml. Requires the External Secrets
# Operator and a configured SecretStore (shown here for AWS Secrets Manager;
# GCP/Vault equivalents follow the same shape).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: clinical-ai
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets-sa }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: clinical-ai
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: backend-secrets }
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: clinical-ai/prod/openrouter-api-key }
    - secretKey: DATABASE_URL
      remoteRef: { key: clinical-ai/prod/database-url }
    - secretKey: OIDC_ISSUER
      remoteRef: { key: clinical-ai/prod/oidc-issuer }
    - secretKey: OIDC_AUDIENCE
      remoteRef: { key: clinical-ai/prod/oidc-audience }
