apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: clinical-ai
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow
  namespace: clinical-ai
spec:
  podSelector: { matchLabels: { app: backend } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api-gateway } }
      ports: [{ port: 8000, protocol: TCP }]
  egress:
    - to:  # otel-collector
        - podSelector: { matchLabels: { app: otel-collector } }
      ports: [{ port: 4317, protocol: TCP }]
    - to:  # postgres (audit + app state)
        - podSelector: { matchLabels: { app: postgres } }
      ports: [{ port: 5432, protocol: TCP }]
    - to:  # DNS
        - namespaceSelector: {}
      ports: [{ port: 53, protocol: UDP }]
    - to:  # egress to OpenRouter / EHR APIs — restrict by NAT gateway/egress
           # firewall IP allowlist at the cloud-provider layer, not just here
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ port: 443, protocol: TCP }]
