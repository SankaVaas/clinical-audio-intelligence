apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clinical-ai
resources:
  - namespace.yaml
  - backend-configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend.yaml
  - ingress.yaml
# backend-secret.example.yaml intentionally NOT included here --
# real secrets are provisioned separately (see comments in that file
# and the upcoming Security step).

commonLabels:
  app.kubernetes.io/part-of: clinical-audio-intelligence
  app.kubernetes.io/managed-by: kustomize
