# DO NOT commit a real Secret manifest to git.
#
# This file documents the shape of the secret the Deployment expects.
# In the "Security" step we'll replace this with an ExternalSecret resource
# that pulls live values from AWS Secrets Manager / GCP Secret Manager /
# HashiCorp Vault via the External Secrets Operator, so no PHI-adjacent
# credential ever lives in the git repo or a CI log.
#
# For local kind/minikube testing only, you can apply a literal version:
#   kubectl create secret generic backend-secrets -n clinical-ai \
#     --from-literal=OPENROUTER_API_KEY=sk-... \
#     --from-literal=DATABASE_URL=postgresql://...
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: clinical-ai
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
