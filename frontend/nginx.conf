server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + WebSocket calls go through the in-cluster API Gateway,
    # not directly to the backend Service.
    # NOTE: these two locations are only exercised once the frontend is
    # deployed behind the in-cluster API Gateway (production/staging). In
    # local dev (docker-compose) and as currently wired, the React app
    # calls the backend directly via config.apiBase/config.wsBase
    # (relying on CORS, not same-origin proxying), so these blocks are
    # inert until the gateway exists -- kept here so the nginx config is
    # ready for that, not because anything hits them today.
    location /api/ {
        proxy_pass http://api-gateway.clinical-ai.svc.cluster.local:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/audio {
        proxy_pass http://api-gateway.clinical-ai.svc.cluster.local:8080/ws/audio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
