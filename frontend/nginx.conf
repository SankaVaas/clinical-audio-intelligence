server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + WebSocket calls go through the in-cluster API Gateway,
    # not directly to the backend Service.
    location /api/ {
        proxy_pass http://api-gateway.clinical-ai.svc.cluster.local:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/audio {
        proxy_pass http://api-gateway.clinical-ai.svc.cluster.local:8080/ws/audio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
